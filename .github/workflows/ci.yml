name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hermetic: the integration tests skip themselves without LibreOffice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q --cov

  render:
    # The real pipeline -- LibreOffice, pdftotext, pdftoppm -- once. The .debs
    # are cached: the Ubuntu mirror can take minutes for LibreOffice alone.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice and poppler (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libreoffice-impress poppler-utils
          version: 1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Integration tests
        run: uv run pytest -q tests/test_integration.py -rs
