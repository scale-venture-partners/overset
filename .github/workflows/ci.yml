name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hermetic: the integration tests skip themselves without LibreOffice.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q --cov

  render:
    # The real pipeline -- LibreOffice, pdftotext, pdftoppm -- once. The .debs
    # are cached: the Ubuntu mirror can take minutes for LibreOffice alone.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Cache the downloaded .debs, not the installed files: restoring files
      # skips the packages' post-install scripts, and LibreOffice installed
      # that way crashes on its first conversion. apt installs from the cached
      # archives and runs every script; only the download is skipped. The
      # package lists are cached with them, so the job can still install when
      # the runner can't reach the Ubuntu mirror (see the script). An older
      # entry's .debs still save the download when there is no exact match.
      - name: Cache LibreOffice packages
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-archives
            ~/apt-lists
          key: apt-libreoffice-${{ runner.os }}-v2
          restore-keys: apt-libreoffice-${{ runner.os }}-
      - name: Install LibreOffice and poppler
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 15
        run: .github/scripts/install-render-deps.sh ~/apt-archives ~/apt-lists
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Integration tests
        run: uv run pytest -q tests/test_integration.py tests/test_powerpoint_layout.py -rs
