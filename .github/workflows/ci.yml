name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hermetic: the integration tests skip themselves without LibreOffice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q --cov

  render:
    # The real pipeline -- LibreOffice, pdftotext, pdftoppm -- once. The .debs
    # are cached: the Ubuntu mirror can take minutes for LibreOffice alone.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Cache the downloaded .debs, not the installed files: restoring files
      # skips the packages' post-install scripts, and LibreOffice installed
      # that way crashes on its first conversion. apt installs from the cached
      # archives and runs every script; only the download is skipped.
      - name: Cache LibreOffice packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-libreoffice-${{ runner.os }}-v1
      - name: Install LibreOffice and poppler
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            libreoffice-impress poppler-utils
          sudo chown -R "$USER" ~/apt-archives
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Integration tests
        run: uv run pytest -q tests/test_integration.py tests/test_powerpoint_layout.py -rs
