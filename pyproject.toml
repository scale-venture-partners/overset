[project]
name = "overset"
version = "0.1.0"
description = "A deck linter: measures what a slide actually renders -- text off the slide, out of its box, colliding, too small, too faint, off-brand -- with ruff-style rule codes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Scale Venture Partners" }]
keywords = ["linter", "powerpoint", "pptx", "slides", "layout", "brand", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "python-pptx>=1.0",
  "pillow>=10",
]

[project.urls]
Repository = "https://github.com/scale-venture-partners/overset"

[project.optional-dependencies]
# The vision rules: one model call over the rendered deck. Everything else is offline.
vision = ["pydantic-ai-slim[anthropic]>=1.0"]

[project.scripts]
overset = "overset.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pydantic-ai-slim[anthropic]>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overset"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["overset"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["overset", "conftest"]
